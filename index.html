<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Office Dungeon</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #111;
        height: 100%;
      }
      /* Full-viewport parent for Phaser Scale.FIT; insets keep HUD off notches / home bar. */
      #game-root {
        width: 100%;
        height: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: env(safe-area-inset-right, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        padding-left: env(safe-area-inset-left, 0px);
      }
    </style>
  </head>
  <body>
    <!-- Mirrors Phaser HUD text for e2e (canvas text is not in the DOM). -->
    <div
      id="hud-test-mirror"
      aria-hidden="true"
      style="
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: pre-wrap;
      "
    ></div>
    <!-- Footer phase + last-action lines for e2e (Phaser footer is canvas-only). -->
    <div
      id="footer-test-mirror"
      aria-hidden="true"
      style="
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: pre-wrap;
      "
    ></div>
    <div
      id="summary-test-mirror"
      aria-hidden="true"
      style="
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: pre-wrap;
      "
    ></div>
    <div
      id="touch-ui-test-mirror"
      aria-hidden="true"
      style="
        position: absolute;
        left: -9999px;
        width: 1px;
        height: 1px;
        overflow: hidden;
        white-space: pre-wrap;
      "
    ></div>
    <div id="game-root" tabindex="0"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
